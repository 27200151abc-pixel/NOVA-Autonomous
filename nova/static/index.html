<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10131b"><title>NOVA — مساعدك الذكي</title>
<style>
:root{color-scheme:dark;--bg:#10131b;--panel:#191e29;--panel2:#202737;--line:#30394b;--text:#edf2fb;--muted:#9ba8bc;--accent:#8b9cff;--accent2:#b5c0ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#26304a 0,transparent 55%),var(--bg);color:var(--text);font:15px/1.7 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100vw - 900px)/2));background:#10131bcc;backdrop-filter:blur(12px);position:sticky;top:0;z-index:2}
.brand{display:flex;align-items:center;gap:12px;font-weight:750;letter-spacing:.08em}.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(145deg,#a8b5ff,#586bdb);display:grid;place-items:center;color:#10131b;font-weight:900;font-size:20px;box-shadow:0 5px 22px #6679ed55}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}.dot{width:7px;height:7px;border-radius:50%;background:#61d6a2;box-shadow:0 0 10px #61d6a277}
main{width:min(900px,100%);margin:0 auto;flex:1;display:flex;flex-direction:column;padding:30px 18px 18px}.welcome{text-align:center;margin:auto auto 24px;max-width:560px}.welcome h1{font-size:clamp(30px,7vw,48px);margin:0 0 6px;letter-spacing:.06em}.welcome p{color:var(--muted);margin:0}
#messages{display:flex;flex-direction:column;gap:14px;padding-bottom:22px}.message{max-width:min(82%,680px);padding:13px 16px;border:1px solid var(--line);border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere}.user{align-self:flex-start;background:#29334a;border-color:#465477;border-bottom-right-radius:5px}.assistant{align-self:flex-end;background:var(--panel);border-bottom-left-radius:5px}.meta{font-size:11px;color:var(--muted);margin-bottom:4px}.pending{opacity:.7}
form{position:sticky;bottom:0;padding:12px 0 max(12px,env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 18%)}.composer{display:flex;align-items:flex-end;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:10px;box-shadow:0 12px 40px #0003}textarea{flex:1;resize:none;max-height:180px;min-height:44px;background:transparent;border:0;outline:0;color:var(--text);font:inherit;padding:8px 6px}textarea::placeholder{color:#78869c}button{border:0;cursor:pointer;font:inherit}#send{width:44px;height:44px;border-radius:14px;background:var(--accent);color:#10131b;font-weight:800;font-size:18px}#send:disabled{opacity:.4;cursor:wait}.actions{display:flex;justify-content:space-between;padding:9px 5px;color:var(--muted);font-size:12px}.actions button{background:transparent;color:var(--muted);padding:4px 7px}.actions button:hover{color:var(--text)}#error{color:#ff9b9b;font-size:12px;min-height:20px;padding:0 8px}
footer{text-align:center;color:#748198;font-size:11px;padding:8px 12px 18px}
@media(max-width:600px){header{height:60px;padding:0 16px}main{padding:22px 12px 12px}.message{max-width:92%}.welcome{margin-top:15vh}.status{font-size:11px}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">N</div><span>NOVA</span></div><div class="status"><span class="dot"></span><span>واجهة تجريبية · اتصال عبر الخادم</span></div></header>
<main>
<section class="panel" style="background:#191e29;border:1px solid #30394b;border-radius:14px;padding:12px;margin-bottom:18px"><div style="font-size:12px;color:#9ba8bc;margin-bottom:6px">رمز الوصول للمحادثة · NOVA_CHAT_TOKEN</div><div style="display:flex;gap:8px"><input id="chat-token" type="password" placeholder="أدخل رمز المحادثة" autocomplete="off" style="flex:1;min-width:0;background:#111722;color:#edf2fb;border:1px solid #30394b;border-radius:9px;padding:10px;direction:ltr"><button id="save-token" type="button" style="background:#8b9cff;color:#10131b;border:0;border-radius:9px;padding:8px 12px">حفظ</button></div></section><section class="welcome" id="welcome"><h1>NOVA</h1><p>مساحة تفكير وعمل، تحت سيطرتك.</p></section>
<section id="messages" aria-live="polite"></section>
<form id="chat-form"><div id="error" role="status"></div><div class="composer"><textarea id="prompt" rows="1" placeholder="اكتب رسالتك إلى NOVA..." autocomplete="off" required></textarea><button id="send" type="submit" aria-label="إرسال">↑</button></div><div class="actions"><span>Enter للإرسال · Shift+Enter لسطر جديد</span><button id="new-chat" type="button">محادثة جديدة</button></div></form>
</main>
<footer>بيانات المحادثة تُحفظ في قاعدة بيانات NOVA على الخادم الذي تشغّله.</footer>
<script>
(()=>{const form=document.getElementById('chat-form'),input=document.getElementById('prompt'),send=document.getElementById('send'),messages=document.getElementById('messages'),welcome=document.getElementById('welcome'),error=document.getElementById('error'),newChat=document.getElementById('new-chat');let conversationId=localStorage.getItem('nova_conversation_id')||null;let chatToken=sessionStorage.getItem('nova_chat_token')||'';const tokenInput=document.getElementById('chat-token');tokenInput.value=chatToken;document.getElementById('save-token').addEventListener('click',()=>{chatToken=tokenInput.value.trim();if(chatToken)sessionStorage.setItem('nova_chat_token',chatToken);else sessionStorage.removeItem('nova_chat_token');error.textContent='تم حفظ رمز الوصول في جلسة المتصفح.'});
function addMessage(role,text){welcome.hidden=true;const node=document.createElement('article');node.className='message '+role;const label=document.createElement('div');label.className='meta';label.textContent=role==='user'?'أنت':'NOVA';const body=document.createElement('div');body.textContent=text;node.append(label,body);messages.append(node);node.scrollIntoView({behavior:'smooth',block:'end'});return node}
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,180)+'px'});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
form.addEventListener('submit',async e=>{e.preventDefault();const message=input.value.trim();if(!message||send.disabled)return;error.textContent='';addMessage('user',message);input.value='';input.style.height='auto';send.disabled=true;const pending=addMessage('assistant','NOVA بتفكر...');pending.classList.add('pending');try{const response=await fetch('/v1/chat',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+chatToken},body:JSON.stringify({message,conversation_id:conversationId})});const data=await response.json();if(!response.ok)throw new Error(data.detail||'تعذر الاتصال بالخادم');conversationId=data.conversation_id;localStorage.setItem('nova_conversation_id',conversationId);pending.classList.remove('pending');pending.lastChild.textContent=data.reply||'لم يصل رد.'}catch(err){pending.remove();error.textContent=err.message||'حدث خطأ غير متوقع'}finally{send.disabled=false;input.focus()}});
newChat.addEventListener('click',()=>{conversationId=null;localStorage.removeItem('nova_conversation_id');messages.replaceChildren();welcome.hidden=false;error.textContent='';input.focus()});input.focus()})();
</script>
</body></html>
