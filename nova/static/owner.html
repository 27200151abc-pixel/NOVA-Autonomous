<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10131b"><title>NOVA — لوحة المالك</title><style>
:root{color-scheme:dark;--bg:#10131b;--panel:#191e29;--line:#30394b;--text:#edf2fb;--muted:#9ba8bc;--accent:#9eafff;--green:#69d5a7;--red:#ff9292}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.7 system-ui,sans-serif}header{padding:18px max(18px,calc((100vw - 850px)/2));border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}a{color:var(--accent);text-decoration:none}main{max-width:850px;margin:30px auto;padding:0 16px}.panel,.request{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}h1{font-size:24px;margin:0}h2{font-size:18px;margin:0 0 12px}p{color:var(--muted)}input{width:100%;background:#111722;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;direction:ltr}button{font:inherit;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;background:var(--accent);color:#10131b;font-weight:700}.secondary{background:#323d53;color:var(--text)}.danger{background:#5b3039;color:#ffd9df}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.request pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#111722;border-radius:10px;padding:12px;color:#cbd6ea;direction:ltr;text-align:left}.muted{color:var(--muted);font-size:13px}#status{min-height:24px;color:var(--muted)}.good{color:var(--green)}.bad{color:var(--red)}.hidden{display:none}
</style></head><body><header><h1>NOVA / OWNER</h1><a href="/">العودة للمحادثة ←</a></header><main>
<section class="panel"><h2>مصادقة المالك</h2><p>أدخل NOVA_OWNER_TOKEN الذي ضبطته على الخادم. يُحفظ داخل جلسة علامة التبويب فقط.</p><input id="token" type="password" placeholder="Bearer token" autocomplete="off"><div class="row" style="margin-top:12px"><button id="connect">اتصال آمن</button><button id="forget" class="secondary">مسح الرمز</button></div><div id="status" role="status"></div></section>
<section class="panel"><div class="row" style="justify-content:space-between"><h2>طلبات الموافقة</h2><button id="refresh" class="secondary">تحديث</button></div><div id="queue"><p>اتصل أولاً لعرض الطلبات.</p></div></section>
<section class="panel"><h2>سياسة NOVA الحالية</h2><pre id="policy" class="muted">—</pre></section>
</main><script>
(()=>{const tokenInput=document.getElementById('token'),status=document.getElementById('status'),queue=document.getElementById('queue'),policyBox=document.getElementById('policy');let token=sessionStorage.getItem('nova_owner_token')||'';tokenInput.value=token;
function say(text,ok=false){status.textContent=text;status.className=ok?'good':'bad'}
async function api(path,options={}){const res=await fetch(path,{...options,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,...(options.headers||{})}});const data=await res.json().catch(()=>({detail:'استجابة غير مفهومة'}));if(!res.ok)throw new Error(data.detail||'فشل الطلب');return data}
function makeRequest(item){const card=document.createElement('article');card.className='request';const title=document.createElement('h2');title.textContent=item.tool_name+' · '+item.status;const id=document.createElement('div');id.className='muted';id.textContent='ID: '+item.id;const args=document.createElement('pre');try{args.textContent=JSON.stringify(JSON.parse(item.arguments),null,2)}catch{args.textContent=item.arguments}const row=document.createElement('div');row.className='row';for(const [label,decision,cls] of [['موافقة وتنفيذ','approve',''],['رفض','reject','danger']]){const b=document.createElement('button');b.textContent=label;if(cls)b.className=cls;b.addEventListener('click',async()=>{b.disabled=true;try{const result=await api('/v1/approvals/'+encodeURIComponent(item.id)+'/decision',{method:'POST',body:JSON.stringify({decision})});say(decision==='approve'?'تمت الموافقة. الحالة: '+result.status:'تم رفض الطلب.',true);await refresh()}catch(e){say(e.message);b.disabled=false}});row.append(b)}card.append(title,id,args,row);return card}
async function refresh(){try{const [data,p]=await Promise.all([api('/v1/approvals?status=pending'),api('/v1/owner-policy')]);queue.replaceChildren();if(!data.approvals.length){const empty=document.createElement('p');empty.textContent='لا توجد طلبات معلقة حالياً.';queue.append(empty)}else data.approvals.forEach(x=>queue.append(makeRequest(x)));policyBox.textContent=JSON.stringify(p,null,2);say('متصل. عدد الطلبات المعلقة: '+data.approvals.length,true)}catch(e){say(e.message)}}
document.getElementById('connect').addEventListener('click',async()=>{token=tokenInput.value.trim();sessionStorage.setItem('nova_owner_token',token);await refresh()});
document.getElementById('refresh').addEventListener('click',refresh);
document.getElementById('forget').addEventListener('click',()=>{token='';tokenInput.value='';sessionStorage.removeItem('nova_owner_token');queue.replaceChildren();policyBox.textContent='—';say('تم مسح الرمز من جلسة المتصفح.',true)});
if(token)refresh();
})();
</script></body></html>
