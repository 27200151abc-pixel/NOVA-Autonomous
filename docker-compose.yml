services:
  nova:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - nova-data:/data
      - nova-workspace:/workspace
    environment:
      NOVA_DATABASE_PATH: /data/nova.sqlite3
      NOVA_WORKSPACE_ROOT: /workspace
    restart: unless-stopped

volumes:
  nova-data:
  nova-workspace:
