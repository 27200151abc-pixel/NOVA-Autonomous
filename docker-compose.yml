services:
  nova:
    build: .
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - nova-data:/data
      - nova-workspace:/workspace
      - ./nova/plugins:/app/nova/plugins:ro
    environment:
      NOVA_DATABASE_PATH: /data/nova.sqlite3
      NOVA_WORKSPACE_ROOT: /workspace
      NOVA_PLUGIN_WORKER_URL: http://plugin-worker:8090
    depends_on:
      plugin-worker:
        condition: service_healthy
    networks:
      - default
      - plugin-private
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.00
    restart: unless-stopped

  plugin-worker:
    build:
      context: ./plugin-worker
    volumes:
      - ./nova/plugins:/plugins:ro
    environment:
      PLUGIN_WORKER_TOKEN: ${NOVA_PLUGIN_WORKER_TOKEN:?Set NOVA_PLUGIN_WORKER_TOKEN in .env}
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.50
    networks:
      - plugin-private
    restart: unless-stopped

volumes:
  nova-data:
  nova-workspace:

networks:
  plugin-private:
    internal: true
