services:
  nova:
    environment:
      NOVA_BASE_URL: http://model:8000/v1
      NOVA_MODEL: Qwen/Qwen3-30B-A3B
      NOVA_API_KEY: ""

  # Optional self-hosted inference engine. Requires a cloud VM with an NVIDIA GPU
  # and the NVIDIA Container Toolkit. This service is NOT exposed publicly.
  model:
    image: vllm/vllm-openai:v0.10.2
    profiles: ["gpu"]
    ipc: host
    command:
      - --model
      - Qwen/Qwen3-30B-A3B
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "32768"
      - --enable-reasoning
      - --reasoning-parser
      - deepseek_r1
    volumes:
      - nova-model-cache:/root/.cache/huggingface
    expose:
      - "8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 10m
    restart: unless-stopped

volumes:
  nova-model-cache:
