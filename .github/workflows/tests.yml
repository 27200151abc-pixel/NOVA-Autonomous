name: NOVA checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q nova
      - run: python -m pytest -q
      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config -q
      - name: Build isolated plugin worker image
        run: docker compose build plugin-worker
