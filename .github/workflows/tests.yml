name: NOVA checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q nova
      - run: python -m pytest -q
      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          echo "NOVA_PLUGIN_WORKER_TOKEN=ci-test-token" >> .env
          docker compose config -q
      - name: Build NOVA and isolated worker images
        run: docker compose build
      - name: Start the full stack
        run: docker compose up -d
      - name: Verify API health and authenticated plugin execution
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8000/health; then break; fi
            sleep 2
          done
          docker compose exec -T nova python -c "import json,os; from nova import main; main.settings.nova_policy_path='/tmp/test-policy.json'; main.settings.nova_plugins_dir='/app/nova/plugins'; main.settings.nova_plugin_worker_token=os.environ['NOVA_PLUGIN_WORKER_TOKEN']; open('/tmp/test-policy.json','w').write(json.dumps({'enabled_tools':[],'enabled_plugins':['text_stats'],'approval_required':[]})); result=json.loads(main.run_tool('text_stats',{'text':'NOVA is ready'})); assert result=={'characters':13,'words':3,'lines':1}, result"
      - name: Stop the full stack
        if: always()
        run: docker compose down -v
